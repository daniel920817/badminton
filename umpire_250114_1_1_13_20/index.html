<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rally 250114_1 · 1_13_20 — 抓到裁判</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef1ec; --panel:#ffffff; --panel-2:#f6f8f4; --line:#d3dbd2;
  --ink:#181f1b; --ink-2:#4b5751; --ink-3:#7c8a83;
  --accent:#0f7a5a; --accent-soft:#d7ece3;
  --pA:#e07b24; --pB:#2f6fe0;
  --scene-bg:#cfd8cf; --gt:#ffffff; --bad:#d92d3a;
  --shadow:0 1px 2px rgba(24,31,27,.06),0 8px 24px rgba(24,31,27,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0e1412; --panel:#151d1a; --panel-2:#1b2521; --line:#2b3733;
  --ink:#e8efea; --ink-2:#a3b2ab; --ink-3:#71827b;
  --accent:#3ecfa0; --accent-soft:#12302a;
  --pA:#ff9a52; --pB:#6c9dff;
  --scene-bg:#0f1714; --gt:#ffffff; --bad:#ff5c66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0e1412; --panel:#151d1a; --panel-2:#1b2521; --line:#2b3733;
  --ink:#e8efea; --ink-2:#a3b2ab; --ink-3:#71827b;
  --accent:#3ecfa0; --accent-soft:#12302a;
  --pA:#ff9a52; --pB:#6c9dff;
  --scene-bg:#0f1714; --gt:#ffffff; --bad:#ff5c66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,"Noto Sans TC",sans-serif;font-size:14px;line-height:1.55;
  padding-block:20px 28px;padding-left:16px;padding-right:16px;max-width:1560px;margin:0 auto}
h1,h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance}

header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;margin-bottom:18px}
h1{font-size:26px;letter-spacing:-.01em}
.slug{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);
  background:var(--accent-soft);padding:3px 9px;border-radius:4px}
header p{margin:0;color:var(--ink-2);max-width:66ch}

.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);overflow:hidden;margin-bottom:18px}
.stat{padding:9px 16px;border-right:1px solid var(--line);flex:1 1 140px;min-width:0}
.stat:last-child{border-right:0}
.stat dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0;display:flex;align-items:center;gap:6px}
.stat dd{margin:1px 0 0;font-family:"IBM Plex Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.stat dd small{font-size:11px;color:var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.a{background:var(--pA)} .dot.b{background:var(--pB)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;
  padding:8px 12px;border-bottom:1px solid var(--line)}
.card-hd h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.btns{display:flex;gap:4px;flex-wrap:wrap}

#scene{width:100%;aspect-ratio:1/1;max-height:78vh;display:block;cursor:grab;touch-action:none}
#scene:active{cursor:grabbing}
.hint{margin:0;padding:7px 12px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}

.views-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.views-hd h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.views{grid-template-columns:1fr}}
.tile{position:relative;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:8/5;max-width:100%}
.tile video{width:100%;height:100%;display:block;object-fit:cover}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tile .tag{position:absolute;left:6px;top:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:3px}
.tile.fish .tag::after{content:" · fisheye";color:#ffc48a}

.notes{padding:11px 13px;font-size:12.5px;color:var(--ink-2);display:grid;gap:7px;align-content:start}
.notes b{color:var(--ink);font-weight:600}
.notes code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--panel-2);
  border:1px solid var(--line);padding:0 4px;border-radius:3px}
.key{display:flex;gap:14px;flex-wrap:wrap}
.key span{display:flex;align-items:center;gap:6px}

.transport{margin-top:16px;padding:12px 14px 14px}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--line);border-radius:6px;padding:4px 11px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{min-width:74px;font-weight:600;font-size:13px;padding:5px 13px}
.readout{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);white-space:nowrap}
.readout b{color:var(--ink)}
input[type=range]{flex:1 1 220px;min-width:140px;accent-color:var(--accent)}
.sp{font-family:"IBM Plex Mono",monospace}
#jitter{width:100%;height:84px;cursor:pointer;display:block;margin-top:10px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
footer{margin-top:20px;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;overflow-wrap:anywhere}
header p{max-width:90ch}
.jumps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.jumps .lbl{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.stat dd.bad{color:var(--bad)}
.dot.g{background:var(--gt);box-shadow:0 0 0 1px var(--ink-3)} .sw.bad{background:var(--bad)}
.tile.badv{outline:3px solid var(--bad);outline-offset:-3px}
.tile .tag.bad{background:var(--bad)}
.notes ul{margin:0;padding-left:18px;display:grid;gap:5px}
</style>

<header>
  <h1 id="h1">Rally</h1>
  <span class="slug" id="slug"></span>
  <p id="desc"></p>
</header>

<dl class="stats" id="stats"></dl>

<div class="stage">
  <section class="card">
    <div class="card-hd">
      <h2>3D 重建 · 世界座標</h2>
      <div class="btns">
        <button id="bTop">俯視</button>
        <button id="bSide">側視</button>
        <button id="bCams" aria-pressed="true">相機</button>
        <button id="bNet" aria-pressed="true">球網</button>
        <button id="bGT" aria-pressed="true">GT 對照</button>
        <button id="bWire" aria-pressed="false">線框</button>
      </div>
    </div>
    <div style="position:relative"><canvas id="scene"></canvas>
      <div id="gtBadge" hidden style="position:absolute;left:10px;top:10px;font-size:12px;padding:3px 8px;border-radius:4px;background:var(--bad);color:#fff"></div></div>
    <p class="hint" id="hint">正在載入兩位選手的重建與 GT mesh…</p>
    <p class="hint" id="hint2" hidden>拖曳旋轉 · 滾輪或雙指縮放 · 右鍵或 Shift+拖曳平移。橘／藍實心 = EasyMocap 重建，白色半透明 = 學長 GT。</p>
  </section>

  <section>
    <div class="views-hd">
      <h2>原始視角</h2>
      <div class="btns" role="group" aria-label="相機組">
        <button class="set" data-set="left" aria-pressed="true">左半場相機 0 2 4 7 9</button>
        <button class="set" data-set="right" aria-pressed="false">右半場相機 1 3 5 6 8</button>
      </div>
    </div>
    <div class="views" id="views"></div>
  </section>
</div>

<section class="card transport">
  <div class="trow">
    <button id="play">播放</button>
    <span class="readout">frame <b id="fnum">000</b> / <span id="fmax">0</span> &nbsp;·&nbsp; 原影片 <b id="fraw">0</b> &nbsp;·&nbsp; t <b id="tsec">0.00</b> s</span>
    <input id="scrub" type="range" min="0" max="1" value="0" step="1" aria-label="frame scrubber">
    <div class="btns" role="group" aria-label="播放速度">
      <button class="sp" data-r="0.1">0.1×</button>
      <button class="sp" data-r="0.25">0.25×</button>
      <button class="sp" data-r="0.5">0.5×</button>
      <button class="sp" data-r="1" aria-pressed="true">1×</button>
    </div>
    <button id="bSkel" aria-pressed="true">骨架疊圖</button>
    <button id="bBox" aria-pressed="true">偵測框</button>
  </div>
  <div class="jumps" id="jumps"></div>
  <canvas id="jitter"></canvas>
  <div class="legend">
    <span><i class="sw" style="background:var(--pA)"></i>左半場選手</span>
    <span><i class="sw" style="background:var(--pB)"></i>右半場選手</span>
    <span><i class="sw bad"></i>該格有視角選到非球員</span>
    <span>每幀手腕誤差 vs GT（骨盆對齊後，取左右手較大者），縱軸 0–400 mm，虛線 150 mm · 點一下跳到該幀</span>
  </div>
</section>

<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
let NF=2, FPS=50, F0=0;
const FLOOR=0.5;
const SETS={left:['0','2','4','7','9'], right:['1','3','5','6','8']};
const ALL=[...SETS.left,...SETS.right];
const SIDES=['left','right'];
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={left:()=>tok('--pA')||'#e07b24', right:()=>tok('--pB')||'#2f6fe0'};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- video tiles ----------
const viewsEl=document.getElementById('views');
const tiles={}, vids={}, cvs={}, tags={};
ALL.forEach(v=>{
  const d=document.createElement('div'); d.className='tile'+((v==='3'||v==='4')?' fish':'');
  d.innerHTML=`<video muted playsinline preload="auto"></video><canvas></canvas><span class="tag">view ${v}</span>`;
  viewsEl.appendChild(d); tiles[v]=d; vids[v]=d.querySelector('video'); cvs[v]=d.querySelector('canvas'); tags[v]=d.querySelector('.tag');
});
const note=document.createElement('div'); note.className='card notes'; viewsEl.appendChild(note);
let curSet='left';
function showSet(s){
  curSet=s;
  ALL.forEach(v=>tiles[v].hidden=!SETS[s].includes(v));
  document.querySelectorAll('.set').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===s));
  requestAnimationFrame(()=>{sizeOverlays(); if(cur>=0)drawOverlay(cur);});
}
document.querySelectorAll('.set').forEach(b=>b.addEventListener('click',()=>showSet(b.dataset.set)));
const master=vids['0'];
// 整支 mp4 先抓成 blob 再播：任何 server (包括 python3 -m http.server) 都能任意跳格
ALL.forEach(v=>fetch(`view${v}.mp4`).then(r=>{if(!r.ok)throw 0;return r.blob();})
  .then(b=>{vids[v].src=URL.createObjectURL(b); if(cur>=0)vids[v].currentTime=(cur+0.5)/FPS;})
  .catch(()=>{vids[v].src=`view${v}.mp4`;}));

// ---------- three.js ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam3=new THREE.PerspectiveCamera(40,1,0.1,200);
function paintBg(){scene.background=new THREE.Color(tok('--scene-bg')||'#cfd8cf');}
paintBg();
scene.add(new THREE.HemisphereLight(0xffffff,0x3d4a44,1.25));
const key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(5,10,6); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.4); fill.position.set(-6,4,-5); scene.add(fill);

// floor + court lines (drawn, no texture needed)
const surround=new THREE.Mesh(new THREE.PlaneGeometry(14,24),
  new THREE.MeshStandardMaterial({color:0x2c5e45,roughness:.95}));
surround.rotation.x=-Math.PI/2; surround.position.y=-0.004; scene.add(surround);
const court=new THREE.Mesh(new THREE.PlaneGeometry(6.10,13.40),new THREE.MeshStandardMaterial({color:0x1f8a55,roughness:.9}));
court.rotation.x=-Math.PI/2; court.position.y=-0.002; scene.add(court);
function seg(pts,color,op){
  const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));
  return new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:op<1,opacity:op??1}));
}
(function(){
  const L=6.70, Wd=3.05, Ws=2.59, lineMat=new THREE.MeshBasicMaterial({color:0xf4f6f2});
  const strip=(x0,z0,x1,z1)=>{const w=0.04, dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)+w;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(dx?len:w,dz?len:w),lineMat);
    m.rotation.x=-Math.PI/2; m.position.set((x0+x1)/2,0.001,(z0+z1)/2); scene.add(m);};
  [-Wd,-Ws,Ws,Wd].forEach(x=>strip(x,-L,x,L));
  [-L,-5.94,-1.98,1.98,5.94,L].forEach(z=>strip(-Wd,z,Wd,z));
  strip(0,1.98,0,L); strip(0,-1.98,0,-L);
})();
const netG=new THREE.Group(); scene.add(netG);
(function(){
  const SW=3.05, nh=1.55, top=1.524;
  const posts=new THREE.MeshStandardMaterial({color:0xe9ece8,roughness:.6});
  [-SW,SW].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,nh,10),posts);p.position.set(x,nh/2,0);netG.add(p);});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(SW*2,0.76),
    new THREE.MeshBasicMaterial({color:0x1b1f1d,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
  mesh.position.set(0,top-0.38,0); netG.add(mesh);
  netG.add(seg([[-SW,top,0],[SW,top,0]],0xffffff,.95));
  netG.add(seg([[-SW,top-0.76,0],[SW,top-0.76,0]],0x9aa39e,.6));
})();

const camG=new THREE.Group(); scene.add(camG);
const W2T=(x,y,z)=>[-x,FLOOR-y,z];

const meshes={}, gtMeshes={}, mats={};
SIDES.forEach(s=>{
  mats[s]=new THREE.MeshStandardMaterial({color:new THREE.Color(COL[s]()),roughness:.55,metalness:.05,side:THREE.DoubleSide});
});
const gtMat=new THREE.MeshStandardMaterial({color:new THREE.Color(tok('--gt')||'#7a5af8'),roughness:.6,
  transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide});

// orbit
let az=-1.05, el=0.55, dist=15, tgt=new THREE.Vector3(0,0.6,0);
function place(){
  cam3.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az), tgt.y+dist*Math.sin(el), tgt.z+dist*Math.cos(el)*Math.cos(az));
  cam3.lookAt(tgt);
}
const ptrs=new Map(); let pinch0=null, panMode=false;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  panMode=e.button===2||e.shiftKey;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),dist};}
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];
    dist=Math.max(1.5,Math.min(40,pinch0.dist*pinch0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));place();return;}
  if(panMode){
    const k=dist*0.0016, r=new THREE.Vector3().setFromMatrixColumn(cam3.matrix,0);
    const f=new THREE.Vector3(Math.sin(az),0,Math.cos(az));
    tgt.addScaledVector(r,-dx*k).addScaledVector(f,-dy*k);
  } else {
    az-=dx*0.006; el=Math.max(0.03,Math.min(1.55,el+dy*0.005));
  }
  place();
});
const up=e=>{ptrs.delete(e.pointerId); if(ptrs.size<2)pinch0=null;};
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();
  dist=Math.max(1.5,Math.min(40,dist*(1+Math.sign(e.deltaY)*0.09))); place();},{passive:false});
document.getElementById('bTop').addEventListener('click',()=>{az=-Math.PI/2;el=1.55;dist=19;tgt.set(0,0,0);place();});
document.getElementById('bSide').addEventListener('click',()=>{az=-Math.PI/2;el=0.22;dist=17;tgt.set(0,0.8,0);place();});

function resize(){
  const w=canvas.clientWidth||600, h=canvas.clientHeight||600;
  renderer.setSize(w,h,false); cam3.aspect=w/h; cam3.updateProjectionMatrix();
}

// ---------- data ----------
let CAMS=null, META=null, BOX=null; const KP={}, VERT={}, VGT={};
function fillPage(){
  NF=META.nf; FPS=META.fps; F0=META.f0;
  document.getElementById('h1').textContent=META.title;
  document.getElementById('slug').textContent=META.slug;
  document.getElementById('desc').textContent=META.desc;
  document.getElementById('fmax').textContent=NF-1;
  const sc=document.getElementById('scrub'); sc.max=NF-1;
  const P=META.players, wv=s=>Object.entries(P[s].wrong_per_view).filter(([,n])=>n).map(([v,n])=>`cam${v}×${n}`).join(' ')||'無';
  const nw=s=>Object.values(P[s].wrong_per_view).reduce((a,b)=>a+b,0);
  document.getElementById('stats').innerHTML=`
  <div class="stat"><dt>片長</dt><dd>${NF} <small>frames · ${(NF/FPS).toFixed(2)} s @${FPS}fps · 原影片 ${F0}–${F0+NF-1}</small></dd></div>
  ${SIDES.map(s=>`<div class="stat"><dt><i class="dot ${s==='left'?'a':'b'}"></i>${s==='left'?'左':'右'}半場 PA-MPJPE</dt><dd>${P[s].pa_mpjpe?`${P[s].pa_mpjpe.mean} <small>mm 平均 / ${P[s].pa_mpjpe.max} max</small>`:'<small>無有效 GT</small>'}</dd></div>`).join('')}
  ${SIDES.map(s=>`<div class="stat"><dt><i class="dot ${s==='left'?'a':'b'}"></i>${s==='left'?'左':'右'}半場 手腕誤差</dt><dd${P[s].wrist_stat&&P[s].wrist_stat.max>300?' class="bad"':''}>${P[s].wrist_stat?`${P[s].wrist_stat.mean} <small>mm 平均 / ${P[s].wrist_stat.max} max</small>`:'<small>無有效 GT</small>'}</dd></div>`).join('')}
  ${SIDES.map(s=>`<div class="stat"><dt><i class="dot ${s==='left'?'a':'b'}"></i>${s==='left'?'左':'右'}半場 選錯人</dt><dd${nw(s)?' class="bad"':''}>${nw(s)} <small>(格,視角) · ${wv(s)}</small></dd></div>`).join('')}`;
  note.innerHTML=`<div class="key"><span><i class="dot a"></i><b>左半場選手</b></span><span><i class="dot b"></i><b>右半場選手</b></span><span><i class="dot g"></i><b>學長 GT</b></span></div>
  <ul>${META.notes.map(n=>`<li>${n}</li>`).join('')}
  <li>骨架 = 重建 SMPL 的 25 個 body25 關節投影回各視角。框 = <code>filter_court.py</code> 在這個視角選中的 2D 偵測；跟 GT 回投影的 IoU &lt; 0.3 就標成紅色「非球員」。</li>
  <li>影片是原始影片；魚眼（cam 4 / cam 3）顯示原始畫面，骨架投影已套畸變參數，這兩路不畫偵測框（偵測是在去畸變影像上做的）。</li></ul>`;
  const J=document.getElementById('jumps');
  if(META.jumps.length){J.innerHTML='<span class="lbl">跳到</span>'+META.jumps.map((j,i)=>`<button data-j="${i}">${esc(j.label)}</button>`).join('');
    J.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>seek(META.jumps[+b.dataset.j].frame)));}
  document.getElementById('foot').textContent=`run: ${META.run}/{left,right} · split ${META.split} · 重建 SMPL ${META.players.left.gender} / GT SMPL ${META.players.left.gt_gender}`;
  document.title=META.title;
}
async function boot(){
  [META,CAMS,BOX]=await Promise.all(['meta.json','cams.json','boxes.json'].map(n=>fetch(n).then(r=>r.json())));
  fillPage(); buildCams();
  const bin=n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.arrayBuffer();}).then(b=>new Uint16Array(b));
  const [fa,kl,kr,vl,vr,gl,gr]=await Promise.all([
    fetch('faces.json').then(r=>r.json()),
    fetch('kp_left.json').then(r=>r.json()), fetch('kp_right.json').then(r=>r.json()),
    bin('verts_left.bin'), bin('verts_right.bin'), bin('verts_left_gt.bin'), bin('verts_right_gt.bin')
  ]);
  KP.left=kl; KP.right=kr; VERT.left=vl; VERT.right=vr; VGT.left=gl; VGT.right=gr;
  const faces=Uint16Array.from(fa);
  const mk=mat=>{const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(META.nverts*3),3));
    geo.setIndex(new THREE.BufferAttribute(faces,1)); const m=new THREE.Mesh(geo,mat); scene.add(m); return m;};
  SIDES.forEach(s=>{meshes[s]=mk(mats[s]); gtMeshes[s]=mk(gtMat); gtMeshes[s].renderOrder=2;});
  document.getElementById('hint').hidden=true; document.getElementById('hint2').hidden=false;
  cur=-1; setFrame(Math.round((master.currentTime||0)*FPS)); drawJitter();
}
function buildCams(){
  ALL.forEach(v=>{
    const c=CAMS[v], p=W2T(...c.C);
    const col=new THREE.Color(c.side==='left'?COL.left():COL.right());
    const box=new THREE.Mesh(new THREE.BoxGeometry(.34,.24,.24),new THREE.MeshStandardMaterial({color:col,roughness:.7}));
    box.position.set(...p);
    const d=c.R[2], q=W2T(c.C[0]+d[0]*2,c.C[1]+d[1]*2,c.C[2]+d[2]*2);
    box.lookAt(...q);
    camG.add(box); camG.add(seg([p,q],col,.8));
  });
}
function fillMesh(m,V,L,S,f){
  const n=META.nverts, off=f*n*3, pos=m.geometry.attributes.position.array;
  for(let i=0;i<n;i++){const o=off+i*3;
    pos[i*3]=-(V[o]*S[0]+L[0]); pos[i*3+1]=FLOOR-(V[o+1]*S[1]+L[1]); pos[i*3+2]=V[o+2]*S[2]+L[2];}
  m.geometry.attributes.position.needsUpdate=true;
  m.geometry.computeVertexNormals(); m.geometry.computeBoundingSphere();
}
let showGT=true;
function setMesh(f){
  const inv=SIDES.filter(s=>META.players[s].gt_state&&META.players[s].gt_state[f]===-1);
  const gb=document.getElementById('gtBadge'); gb.hidden=!(showGT&&inv.length);
  gb.textContent=inv.map(s=>(s==='left'?'左':'右')+'半場').join('、')+' GT 被學長標成無效 (mask = −1)，僅供對照';
  SIDES.forEach(s=>{
    if(!meshes[s])return; const P=META.players[s];
    fillMesh(meshes[s],VERT[s],P.lo,P.scale,f);
    const st=P.gt_state?P.gt_state[f]:(P.wrist[f]!==null?1:0), ok=st!==0; gtMeshes[s].visible=showGT&&ok;
    if(showGT&&ok)fillMesh(gtMeshes[s],VGT[s],P.gt_lo,P.gt_scale,f);
  });
}

// ---------- 2D overlay ----------
const LIMBS=[[1,0],[0,15],[0,16],[15,17],[16,18],[1,2],[2,3],[3,4],[1,5],[5,6],[6,7],
 [1,8],[8,9],[9,10],[10,11],[8,12],[12,13],[13,14],[11,22],[22,23],[11,24],[14,19],[19,20],[14,21]];
function project(c,X){
  const R=c.R,T=c.T;
  const zc=R[2][0]*X[0]+R[2][1]*X[1]+R[2][2]*X[2]+T[2]; if(zc<=0.01)return null;
  const a=(R[0][0]*X[0]+R[0][1]*X[1]+R[0][2]*X[2]+T[0])/zc, b=(R[1][0]*X[0]+R[1][1]*X[1]+R[1][2]*X[2]+T[1])/zc;
  const r2=a*a+b*b, rad=1+c.k[0]*r2+c.k[1]*r2*r2+c.k[2]*r2*r2*r2;
  const xd=a*rad+2*c.p[0]*a*b+c.p[1]*(r2+2*a*a), yd=b*rad+c.p[0]*(r2+2*b*b)+2*c.p[1]*a*b;
  return [c.fx*xd+c.cx, c.fy*yd+c.cy];
}
function sizeOverlays(){
  const dpr=Math.min(devicePixelRatio,2);
  SETS[curSet].forEach(v=>{const cv=cvs[v],r=cv.getBoundingClientRect();
    cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));});
}
let showSkel=true, showBox=true;
function drawOverlay(f){
  SETS[curSet].forEach(v=>{
    const cv=cvs[v], ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
    const b=BOX&&BOX[v]?BOX[v][f]:null, bad=!!(b&&b[4]);
    tiles[v].classList.toggle('badv',showBox&&bad);
    tags[v].classList.toggle('bad',showBox&&bad);
    tags[v].textContent=`view ${v}`+(showBox&&bad?' · 選到非球員':'');
    if(!CAMS||!KP.left)return;
    const c=CAMS[v], s=cv.width/c.W;
    if(showSkel)SIDES.forEach(side=>{
      const pts=KP[side][f].map(j=>j[3]>0.05?project(c,j):null);
      ctx.lineWidth=Math.max(1.5,5*s); ctx.lineCap='round'; ctx.strokeStyle=COL[side]();
      LIMBS.forEach(([a,b])=>{if(!pts[a]||!pts[b])return;
        ctx.beginPath();ctx.moveTo(pts[a][0]*s,pts[a][1]*s);ctx.lineTo(pts[b][0]*s,pts[b][1]*s);ctx.stroke();});
      ctx.fillStyle='#fff';
      pts.forEach(p=>{if(!p)return;ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,Math.max(1.3,4.5*s),0,6.284);ctx.fill();});
    });
    if(showBox&&b){
      ctx.strokeStyle=bad?tok('--bad'):'rgba(255,255,255,.85)'; ctx.lineWidth=(bad?3:1.2)*Math.min(devicePixelRatio,2);
      ctx.setLineDash(bad?[]:[6,4]); ctx.strokeRect(b[0]*s,b[1]*s,(b[2]-b[0])*s,(b[3]-b[1])*s); ctx.setLineDash([]);
      if(bad){const fs=Math.round(12*Math.min(devicePixelRatio,2)); ctx.font=`600 ${fs}px "IBM Plex Sans",sans-serif`;
        const t='WRONG', w=ctx.measureText(t).width+8; ctx.fillStyle=tok('--bad');
        ctx.fillRect(b[0]*s,Math.max(0,b[1]*s-fs-6),w,fs+6); ctx.fillStyle='#fff'; ctx.fillText(t,b[0]*s+4,Math.max(fs,b[1]*s-5));}
    }
  });
}

// ---------- 誤差曲線 ----------
const jc=document.getElementById('jitter');
function drawJitter(){
  if(!META)return;
  const dpr=Math.min(devicePixelRatio,2), r=jc.getBoundingClientRect();
  jc.width=Math.max(1,Math.round(r.width*dpr)); jc.height=Math.round(84*dpr);
  const ctx=jc.getContext('2d'), W=jc.width, H=jc.height, MAX=400, top=10*dpr, bh=H-top-3;
  ctx.clearRect(0,0,W,H);
  const X=f=>f/Math.max(NF-1,1)*W, Y=v=>top+bh-Math.min(1,v/MAX)*bh;
  ctx.strokeStyle=tok('--line'); ctx.lineWidth=1; ctx.setLineDash([4*dpr,3*dpr]);
  ctx.beginPath(); ctx.moveTo(0,Y(150)); ctx.lineTo(W,Y(150)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=tok('--bad');
  SIDES.forEach((s,k)=>{const w=META.players[s].wrong;
    for(let f=0;f<NF;f++)if(w[f])ctx.fillRect(X(f)-dpr,k*4*dpr,2*dpr,3*dpr);});
  SIDES.forEach(s=>{
    const w=META.players[s].wrist; ctx.beginPath(); let pen=false;
    for(let f=0;f<NF;f++){if(w[f]===null){pen=false;continue;} const x=X(f),y=Y(w[f]); pen?ctx.lineTo(x,y):ctx.moveTo(x,y); pen=true;}
    ctx.strokeStyle=COL[s](); ctx.lineWidth=1.4*dpr; ctx.stroke();
  });
  SIDES.forEach((s,k)=>{if(META.players[s].wrist.every(x=>x===null)){
    ctx.fillStyle=COL[s](); ctx.font=`${11*dpr}px "IBM Plex Sans",sans-serif`;
    ctx.fillText((s==='left'?'左':'右')+'半場：沒有有效 GT，無法算誤差',8*dpr,top+14*dpr+k*14*dpr);}});
  const x=X(Math.max(cur,0));
  ctx.strokeStyle=tok('--ink'); ctx.lineWidth=1.5*dpr; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
}

// ---------- transport ----------
let cur=-1;
const fnum=document.getElementById('fnum'), fraw=document.getElementById('fraw'), tsec=document.getElementById('tsec'),
      scrub=document.getElementById('scrub'), play=document.getElementById('play');
const vlist=ALL.map(v=>vids[v]);
function setFrame(f){
  f=Math.max(0,Math.min(NF-1,f|0)); if(f===cur)return;
  cur=f; setMesh(f); drawOverlay(f); drawJitter();
  fnum.textContent=String(f).padStart(3,'0'); fraw.textContent=F0+f; tsec.textContent=(f/FPS).toFixed(2);
  if(+scrub.value!==f)scrub.value=f;
}
function seek(f){pause(); f=Math.max(0,Math.min(NF-1,f)); vlist.forEach(v=>{try{v.currentTime=(f+0.5)/FPS;}catch(e){}}); setFrame(f);}
scrub.addEventListener('input',()=>seek(+scrub.value));
jc.addEventListener('click',e=>{const r=jc.getBoundingClientRect(); seek(Math.round((e.clientX-r.left)/r.width*(NF-1)));});
function playAll(){vlist.forEach(v=>v.play().catch(()=>{}));play.textContent='暫停';play.setAttribute('aria-pressed','true');}
function pause(){vlist.forEach(v=>v.pause());play.textContent='播放';play.setAttribute('aria-pressed','false');}
play.addEventListener('click',()=>{
  if(master.paused){ if(master.ended||master.currentTime>=master.duration-0.03)vlist.forEach(v=>v.currentTime=0); playAll(); }
  else pause();
});
document.querySelectorAll('.sp').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sp').forEach(o=>o.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); vlist.forEach(v=>v.playbackRate=+b.dataset.r);
}));
function toggle(id,fn){const b=document.getElementById(id);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);});}
toggle('bSkel',on=>{showSkel=on;drawOverlay(Math.max(cur,0));});
toggle('bBox',on=>{showBox=on;drawOverlay(Math.max(cur,0));});
toggle('bCams',on=>camG.visible=on);
toggle('bNet',on=>netG.visible=on);
toggle('bGT',on=>{showGT=on; const f=cur; cur=-1; setFrame(Math.max(f,0));});
toggle('bWire',on=>SIDES.forEach(s=>mats[s].wireframe=on));
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '){e.preventDefault();play.click();}
  else if(e.key==='ArrowRight'){e.preventDefault();seek(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();seek(cur-1);}
});

let lastSync=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!master.paused){
    if(t-lastSync>400){lastSync=t;
      vlist.forEach(v=>{if(v!==master&&Math.abs(v.currentTime-master.currentTime)>0.08)v.currentTime=master.currentTime;});}
    setFrame(Math.floor(master.currentTime*FPS));
    if(master.ended)pause();
  }
  renderer.render(scene,cam3);
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  paintBg(); SIDES.forEach(s=>mats[s].color.set(COL[s]())); gtMat.color.set(tok('--gt')); drawJitter(); if(cur>=0)drawOverlay(cur);
});
const ro=new ResizeObserver(()=>{resize();sizeOverlays();if(cur>=0)drawOverlay(cur);drawJitter();});
ro.observe(canvas); ALL.forEach(v=>ro.observe(cvs[v])); ro.observe(jc);
showSet('left'); resize(); place(); requestAnimationFrame(loop);
boot().catch(err=>{document.getElementById('hint').textContent='資料載入失敗：'+err.message+'。請用 http server 開啟（python3 -m http.server）。';});
})();
</script>
